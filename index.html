<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Pesquisa Culturama</title>
  </head>
  <body>
    <header>
      <h1>Culturama - pesquisa on-line</h1>
    </header>

    <main>
      <section>
        <form action="#" method="get">
          <fieldset>
            <!-- DADOS PESSOAIS -->
            <legend>Dados Pessoais</legend>
            <label for="userName">Nome</label>
            <input type="text" name="userName" required />
            <br />
            <label for="userAge">Idade</label>
            <input type="number" name="userAge" min="12" max="100" required />
            <br />
            <label for="birthDate">Data de nascimento</label>
            <input type="date" name="birthDate" />
            <br />
            <label for="userEmail">Email</label>
            <input type="email" name="userEmail" required />
            <br />
            <label for="userPhoneNumber">Telefone</label>
            <input
              type="tel"
              id="userPhoneNumber"
              name="userPhoneNumber"
              pattern="[0-9]{2}-[0-9]{5}-[0-9]{4}"
              placeholder="XX-XXXXX-XXXX"
            />
            <br />
            <label for="userImage">Upload de foto</label>
            <input type="file" accept="image/*" name="userImage" />
            <br />
          </fieldset>

          <fieldset>
            <legend>Perfil</legend>
            <p>Genero</p>
            <!-- <label for="userGender">Gênero:</label>
            <select id="userGender" name="userGender" required>
              <option value="">Selecione</option>
              <option value="masculino">Masculino</option>
              <option value="feminino">Feminino</option>
              <option value="outro">Outro</option>
            </select> -->
            <label for="userGenderMasculino">Masculino</label>
            <input
              type="radio"
              id="userGenderMale"
              name="userGender"
              value="masculino"
            />
            <label for="userGenderFemale">Feminino</label>
            <input
              type="radio"
              id="userGenderFemale"
              name="userGender"
              value="feminino"
            />
            <label for="userGenderOther">Outro</label>
            <input
              type="radio"
              id="userGenderOther"
              name="userGender"
              value="outro"
            />
          </fieldset>

          <button type="submit">Enviar</button>
        </form>
      </section>
    </main>

    <footer></footer>
  </body>
</html>
