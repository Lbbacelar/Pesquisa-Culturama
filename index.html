<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Pesquisa Culturama</title>
  </head>
  <body>
    <header>
      <h1>Culturama - pesquisa on-line</h1>
    </header>

    <main>
      <section>
        <form action="#" method="get">
          <fieldset>
            <!-- DADOS PESSOAIS -->
            <legend>Dados Pessoais</legend>
            <label for="userName">Nome</label>
            <input type="text" name="userName" required />
            <br />
            <label for="userAge">Idade</label>
            <input type="number" name="userAge" min="12" max="100" required />
            <br />
            <label for="birthDate">Data de nascimento</label>
            <input type="date" name="birthDate" />
            <br />
            <label for="userEmail">Email</label>
            <input type="email" name="userEmail" required />
            <br />
            <label for="userPhoneNumber">Telefone</label>
            <input
              type="tel"
              id="userPhoneNumber"
              name="userPhoneNumber"
              pattern="[0-9]{2}-[0-9]{5}-[0-9]{4}"
              placeholder="XX-XXXXX-XXXX"
            />
            <br />
            <label for="userImage">Upload de foto</label>
            <input type="file" accept="image/*" name="userImage" />
            <br />
          </fieldset>

          <fieldset>
            <legend>Perfil</legend>
            <p>Genero</p>
            <!-- <label for="userGender">Gênero:</label>
            <select id="userGender" name="userGender" required>
              <option value="">Selecione</option>
              <option value="masculino">Masculino</option>
              <option value="feminino">Feminino</option>
              <option value="outro">Outro</option>
            </select> -->
            <label for="userGenderMasculino">Masculino</label>
            <input
              type="radio"
              id="userGenderMale"
              name="userGender"
              value="masculino"
            />
            <label for="userGenderFemale">Feminino</label>
            <input
              type="radio"
              id="userGenderFemale"
              name="userGender"
              value="feminino"
            />
            <label for="userGenderOther">Outro</label>
            <input
              type="radio"
              id="userGenderOther"
              name="userGender"
              value="outro"
            />
            <br />
            <label for="maritalStatus">Estado civil</label>
            <select name="maritalStatus" id="maritalStatus" required>
              <option value="notInformed">Selecione</option>
              <option value="solteiro">Solteiro</option>
              <option value="casado">Casado</option>
              <option value="divorciado">Divorciado</option>
              <option value="viuvo">Viúvo</option>
            </select>

            <label for="userState">Estado</label>
            <select name="userState" id="userState" required>
              <option value="notInformed">Selecione</option>
              <option value="AC">Acre</option>
              <option value="AL">Alagoas</option>
              <option value="AP">Amapá</option>
              <option value="AM">Amazonas</option>
              <option value="BA">Bahia</option>
              <option value="CE">Ceará</option>
              <option value="DF">Distrito Federal</option>
              <option value="ES">Espírito Santo</option>
              <option value="GO">Goiás</option>
              <option value="MA">Maranhão</option>
              <option value="MT">Mato Grosso</option>
              <option value="MS">Mato Grosso do Sul</option>
              <option value="MG">Minas Gerais</option>
              <option value="PA">Pará</option>
              <option value="PB">Paraíba</option>
              <option value="PR">Paraná</option>
              <option value="PE">Pernambuco</option>
              <option value="PI">Piauí</option>
              <option value="RJ">Rio de Janeiro</option>
              <option value="RN">Rio Grande do Norte</option>
              <option value="RS">Rio Grande do Sul</option>
              <option value="RO">Rondônia</option>
              <option value="RR">Roraima</option>
              <option value="SC">Santa Catarina</option>
              <option value="SP">São Paulo</option>
              <option value="SE">Sergipe</option>
              <option value="TO">Tocantins</option>
            </select>
            <br />
            <label for="userCity">Cidade</label>
            <input
              type="text"
              id="userCity"
              name="userCity"
              autocomplete="address-level2"
              placeholder="Fortaleza"
            />
          </fieldset>

          <fieldset>
            <legend>Habitos</legend>
            <label for="userHobbies">Quais são seus hobbies?</label>
            <p>Redes Socias</p>
            <br />
            <label for="hobbyFacebook">Facebook</label>
            <input
              type="checkbox"
              id="hobbyFacebook"
              name="userHobbies"
              value="facebook"
            />
            <label for="hobbyInstagram">Instagram</label>
            <input
              type="checkbox"
              id="hobbyInstagram"
              name="userHobbies"
              value="instagram"
            />
            <label for="hobbyTwitter">Twitter</label>
            <input
              type="checkbox"
              id="hobbyTwitter"
              name="userHobbies"
              value="twitter"
            />
            <label for="hobbyLinkedIn">LinkedIn</label>
            <input
              type="checkbox"
              id="hobbyLinkedIn"
              name="userHobbies"
              value="linkedin"
            />
            <label for="hobbyTikTok">TikTok</label>
            <input
              type="checkbox"
              id="hobbyTikTok"
              name="userHobbies"
              value="tiktok"
            />
          </fieldset>

          <button type="submit">Enviar</button>
        </form>
      </section>
    </main>

    <footer></footer>
  </body>
</html>
